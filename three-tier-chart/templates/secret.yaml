{{- if .Values.database.auth.createSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.database.auth.existingSecret }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ required "Set database.auth.password when createSecret is true" .Values.database.auth.password | quote }}
  DB_PASSWORD: {{ required "Set database.auth.password when createSecret is true" .Values.database.auth.password | quote }}
{{- end }}